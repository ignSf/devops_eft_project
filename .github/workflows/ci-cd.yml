name: Pipeline CI/CD DevOps EFT (ISY1101)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: devops-eks-cluster
  ECR_BACKEND_IMAGE: ${{ secrets.ECR_BACKEND_REPOSITORY || '571617431105.dkr.ecr.us-east-1.amazonaws.com/devops-backend' }}
  ECR_FRONTEND_IMAGE: ${{ secrets.ECR_FRONTEND_REPOSITORY || '571617431105.dkr.ecr.us-east-1.amazonaws.com/devops-frontend' }}

jobs:
  # ==========================================
  # ETAPA 1: Integration & Unit Testing
  # ==========================================
  test:
    name: 🧪 Pruebas Unitarias y Calidad
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Instalar dependencias del Backend
        run: |
          cd backend
          npm ci

      - name: 🚦 Ejecutar Pruebas Unitarias con Jest
        run: |
          cd backend
          npm test -- --passWithNoTests

  # ==========================================
  # ETAPA 2: Build y Push de Contenedores Docker
  # ==========================================
  build-and-push:
    name: 🐳 Construcción y Publicación de Imágenes Docker
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Backend
      - name: 🏗️ Construir y Publicar Imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_BACKEND_IMAGE }}:latest
            ${{ env.ECR_BACKEND_IMAGE }}:v${{ github.run_number }}

      # Build & Push Frontend
      - name: 🏗️ Construir y Publicar Imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_FRONTEND_IMAGE }}:latest
            ${{ env.ECR_FRONTEND_IMAGE }}:v${{ github.run_number }}

  # ==========================================
  # ETAPA 3: Despliegue Automatizado en AWS EKS
  # ==========================================
  deploy:
    name: 🚀 Despliegue Automatizado en Amazon EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🚀 Rollout Automático en Amazon EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          kubectl rollout restart deployment/frontend-deployment
          kubectl rollout restart deployment/backend-deployment
          echo "✅ Rollout v${{ github.run_number }} desplegado automáticamente en EKS."

