name: Pipeline CI/CD DevOps EFT (ISY1101)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # ETAPA 1: Integration & Unit Testing
  # ==========================================
  test:
    name: 🧪 Pruebas Unitarias y Calidad
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Instalar dependencias del Backend
        run: |
          cd backend
          npm ci

      - name: 🚦 Ejecutar Pruebas Unitarias con Jest
        run: |
          cd backend
          npm test

  # ==========================================
  # ETAPA 2: Build & Push de Contenedores Docker
  # ==========================================
  build-and-push:
    name: 🐳 Construcción y Publicación de Imágenes Docker
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔑 Iniciar sesión en Docker Hub / ECR
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || 'duocstudent' }}
          password: ${{ secrets.DOCKER_HUB_TOKEN || 'mocktoken' }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build y Push de Backend
      - name: 🏗️ Construir y Publicar Imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME || 'duocstudent' }}/devops-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME || 'duocstudent' }}/devops-backend:v${{ github.run_number }}

      # Build y Push de Frontend
      - name: 🏗️ Construir y Publicar Imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME || 'duocstudent' }}/devops-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME || 'duocstudent' }}/devops-frontend:v${{ github.run_number }}

  # ==========================================
  # ETAPA 3: Despliegue Automatizado en AWS
  # ==========================================
  deploy:
    name: 🚀 Despliegue Automatizado en AWS (ECS / EC2)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: 🚀 Desplegar en Amazon EKS
        run: |
          # Configurar kubectl para conectarse al clúster EKS
          aws eks update-kubeconfig --name devops-eks-cluster --region ${{ secrets.AWS_REGION || 'us-east-1' }}

          # Actualizar las imágenes en los manifiestos K8s con la nueva versión
          kubectl set image deployment/backend-deployment \
            backend-api=${{ secrets.AWS_ACCOUNT_ID || '571617431105' }}.dkr.ecr.${{ secrets.AWS_REGION || 'us-east-1' }}.amazonaws.com/devops-backend:v${{ github.run_number }} \
            --record

          kubectl set image deployment/frontend-deployment \
            frontend-web=${{ secrets.AWS_ACCOUNT_ID || '571617431105' }}.dkr.ecr.${{ secrets.AWS_REGION || 'us-east-1' }}.amazonaws.com/devops-frontend:v${{ github.run_number }} \
            --record

          # Verificar el estado del despliegue
          kubectl rollout status deployment/backend-deployment --timeout=120s
          kubectl rollout status deployment/frontend-deployment --timeout=120s

          # Mostrar estado final
          kubectl get pods,svc,deployments -o wide
          echo "✅ Despliegue v${{ github.run_number }} completado con éxito en Amazon EKS."

