version: '3.8'

services:
  # Base de Datos Relacional (PostgreSQL)
  database:
    image: postgres:16-alpine
    container_name: devops_postgres_db
    restart: always
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_pass123
      POSTGRES_DB: devops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - devops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user -d devops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Microservicio Backend REST API (Node.js / Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops_backend_api
    restart: always
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: devops_user
      DB_PASSWORD: devops_pass123
      DB_NAME: devops_db
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - devops-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Servidor Frontend Web (Nginx + HTML/JS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops_frontend_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge
    name: devops_internal_network

volumes:
  postgres_data:
    name: devops_postgres_data_volume
